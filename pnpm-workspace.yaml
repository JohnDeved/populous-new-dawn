packages:
  - '.'
nodeLinker: isolated
virtualStoreDir: node_modules/.pnpm
enableGlobalVirtualStore: false
packageImportMethod: hardlink
verifyStoreIntegrity: true
ignoreScripts: true
sideEffectsCache: false
publicHoistPattern:
  - playwright-core
  - js-yaml
  - sharp
  - oxfmt
  - oxlint
verifyDepsBeforeRun: error
patchedDependencies:
  vinext@1.0.0-beta.2: patches/vinext@1.0.0-beta.2.patch
