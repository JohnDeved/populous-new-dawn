developer_instructions = "Read repository instructions, then run the bounded orchestration context command for the relevant subsystem and question. Read the cited current-policy, measurement-rule, workload, correction, and limitation sections of references/modern-performance.md; expand to adjacent sections only when the question needs them, and read the whole historical log only for an explicitly broad audit. Keep microbenchmark, simulation visit, browser frame, and play-session claims separate. Record headed/headless and renderer identity independently, compare paired fingerprints and workloads, and include noise, p95, spikes, hardware, runtime, resolution, warmup, samples, and raw artifacts. Do not edit source, delegate, or invent thresholds or FPS. Write approved artifacts only under an allowed ignored path."
