name: Cloudflare publish
run-name: Cloudflare publish build ${{ github.event.workflow_run.id }} attempt ${{ github.event.workflow_run.run_attempt }}

on:
  workflow_run:
    workflows: [Cloudflare build]
    types: [completed]

permissions: {}

# Never cancel an in-flight upload: a cancelled HTTP request has an uncertain
# remote outcome. Current-head checks reject queued obsolete work.
concurrency:
  group: cloudflare-publish-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && (vars.CLOUDFLARE_ACTIONS_MODE == 'enabled' || (vars.CLOUDFLARE_ACTIONS_MODE == 'preview' && github.event.workflow_run.event == 'pull_request')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # REQUIRED SETUP: selected deployment branches = main only, no tags.
    # Never store this token as an ordinary repository/organization secret.
    environment: cloudflare-worker
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      NODE_OPTIONS: ''
      NODE_PATH: ''
      NODE_COMPILE_CACHE: ''
      NODE_V8_COVERAGE: ''
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_ACTIONS_MODE: ${{ vars.CLOUDFLARE_ACTIONS_MODE }}
    steps:
      - name: Check out only trusted default-branch publisher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts/cloudflare
            scripts/artifact-zip.mjs
          sparse-checkout-cone-mode: false
      - name: Set up trusted Node (no project install)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Verify source identity and materialize bounded data-only artifact
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/cloudflare/control.mjs prepare
      - name: Upload version without changing production traffic
        if: ${{ steps.prepare.outputs.publish == 'true' }}
        id: upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/cloudflare-wrangler.log
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '19321bcee0ed17a93b709cb602dd070c'
          # Worker-scoped preview URL fields; no account-subdomain permission needed.
          wranglerVersion: '4.136.1'
          packageManager: npm
          workingDirectory: .cloudflare-publisher
          # Fixed trusted preflight runs AFTER tool install, immediately before upload.
          preCommands: node ../scripts/cloudflare/control.mjs preflight
          command: versions upload --config wrangler.json --no-bundle --tag ${{ steps.prepare.outputs.sha }} --message github-build-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }} ${{ steps.prepare.outputs.aliasArgument }}
      - name: Validate returned version URLs and promote only eligible main
        if: ${{ steps.prepare.outputs.publish == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT: ${{ steps.upload.outputs.command-output }}
        run: node scripts/cloudflare/control.mjs complete
      - name: Preserve publisher-owned result
        if: ${{ always() && steps.prepare.outputs.publish == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudflare-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloudflare-result.json
          if-no-files-found: warn
          retention-days: 7
