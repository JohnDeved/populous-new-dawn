name: Opt-in single-arm query witness

on:
  pull_request:
    branches: [main]
    types: [ready_for_review, labeled]

permissions:
  contents: read

concurrency:
  group: snapshot-query-arm-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  snapshot-query-arm-evidence:
    name: Opt-in single-arm query witness
    if: ${{ github.event.pull_request.draft == false && github.event.pull_request.state == 'open' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, format('qry-v1:{0}', github.event.pull_request.head.sha)) && (github.event.action != 'labeled' || github.event.label.name == format('qry-v1:{0}', github.event.pull_request.head.sha)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      POPULOUS_BROWSER_SCENARIO: snapshot-query-arm
      CI: 'true'
      NODE_OPTIONS: ''
      NODE_PATH: ''
      NODE_COMPILE_CACHE: ''
      NODE_V8_COVERAGE: ''
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out exact proposed merge
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          architecture: x64
          package-manager-cache: false
      - name: Install locked dependencies and verify supported Chrome
        run: |
          manager="$(node --input-type=module -e 'import fs from "node:fs"; const manager = JSON.parse(fs.readFileSync("package.json", "utf8")).packageManager ?? "npm@11.9.0"; if (!["npm@11.9.0", "pnpm@11.25.0"].includes(manager)) throw Error("Unsupported source package-manager policy"); console.log(manager)')"
          case "$manager" in
            pnpm@11.25.0)
              test -f pnpm-lock.yaml && test -f pnpm-workspace.yaml
              npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.25.0
              pnpm install --frozen-lockfile --ignore-scripts
              ;;
            npm@11.9.0)
              npm install --global --ignore-scripts --no-audit --no-fund npm@11.9.0
              npm ci --no-audit --no-fund
              ;;
          esac
          printf 'Candidate package manager: %s\n' "$manager"
          printf 'PND_PACKAGE_MANAGER=%s\n' "${manager%@*}" >> "$GITHUB_ENV"
          test -x /opt/google/chrome/chrome
          /opt/google/chrome/chrome --version
      - name: Record exact tested source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'PR head: %s\nBase: %s\nTested merge: %s\n' "$PR_HEAD_SHA" "$PR_BASE_SHA" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          node --version
          "$PND_PACKAGE_MANAGER" --version
          if [ "$PND_PACKAGE_MANAGER" = pnpm ]; then
            sha256sum package-lock.json pnpm-lock.yaml pnpm-workspace.yaml node_modules/.modules.yaml node_modules/.pnpm/lock.yaml node_modules/playwright-core/browsers.json
          else
            sha256sum package-lock.json node_modules/.package-lock.json node_modules/playwright-core/browsers.json
          fi
      - name: Run one exact-head non-admitting snapshot witness
        run: node scripts/tutorial-browser/run.mjs
      - name: Reject tracked input mutation
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: git diff --exit-code HEAD --
      - name: Bound original snapshot witness and outer receipts
        id: witness-bounds
        if: ${{ always() }}
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, lstatSync, existsSync } from 'node:fs'
          import assert from 'node:assert/strict'
          const dir = 'outputs/tutorial-browser', MiB = 1024 * 1024
          const allowed = ['arm-snapshot-transfer.json', 'arm-snapshot-expected.json', 'arm-snapshot-source.json',
            'arm-public-load.json', 'arm-query-reader-provenance.json', 'arm-query-frames.json', 'arm-query-witness.json',
            'arm-query-owner.json', 'arm-query-owner-finalization-failure.json']
          if (existsSync(dir)) {
            let witness = 0, outer = 0
            for (const name of readdirSync(dir)) {
              const isOuter = ['receipt.json', 'build.log'].includes(name)
              if (!isOuter && !name.startsWith('arm-')) continue
              const stat = lstatSync(`${dir}/${name}`)
              assert.ok(stat.isFile() && !stat.isSymbolicLink(), 'Artifact must be a regular file')
              if (isOuter) { outer += stat.size; continue }
              assert.ok(allowed.includes(name), 'Unexpected arm witness artifact')
              assert.ok(stat.size <= (name.startsWith('arm-query-owner') ? 65536 : name === 'arm-query-witness.json' ? MiB : 8 * MiB), 'Witness file exceeds fixed cap')
              witness += stat.size
            }
            assert.ok(witness <= 16 * MiB && outer <= 8 * MiB && witness + outer <= 24 * MiB, 'Witness artifact quota exceeded')
          }
          NODE
      - name: Retain bounded non-admitting arm witness
        if: ${{ always() && steps.witness-bounds.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: snapshot-query-arm-evidence-${{ github.sha }}
          path: |
            outputs/tutorial-browser/receipt.json
            outputs/tutorial-browser/build.log
            outputs/tutorial-browser/arm-*.json
          if-no-files-found: warn
          retention-days: 7
