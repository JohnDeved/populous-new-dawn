name: Ready PR checks

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.event.pull_request.base.sha }}-${{ github.sha }}-${{ toJSON(github.event.pull_request.draft) == 'false' && 'ready' || 'draft' }}
  cancel-in-progress: true

env:
  CI: 'true'
  NODE_OPTIONS: ''
  NODE_PATH: ''
  NODE_COMPILE_CACHE: ''
  NODE_V8_COVERAGE: ''
  PND_TEST_CONCURRENCY: '2'
  WRANGLER_SEND_METRICS: 'false'
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Require a ready pull request
        env:
          IS_DRAFT: ${{ toJSON(github.event.pull_request.draft) }}
        run: |
          if [ "$IS_DRAFT" != false ]; then
            echo '::notice::Draft PR: full checks have not run. Mark ready to start them.'
            exit 1
          fi

      - name: Check out the exact proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # erosion-observation.test.mjs reads a pinned historical Git blob.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          architecture: x64
          package-manager-cache: false

      - name: Set up Python for portable fixture tests
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
          architecture: x64

      - name: Record read-only sandbox host metadata
        timeout-minutes: 1
        run: timeout --signal=TERM --kill-after=2s 5s python -I -B scripts/material-lifecycle-evidence/host_metadata.py

      - name: Install locked dependencies
        run: |
          manager="$(node --input-type=module -e 'import fs from "node:fs"; const manager = JSON.parse(fs.readFileSync("package.json", "utf8")).packageManager ?? "npm@11.9.0"; if (!["npm@11.9.0", "pnpm@11.25.0"].includes(manager)) throw Error("Unsupported source package-manager policy"); console.log(manager)')"
          case "$manager" in
            pnpm@11.25.0)
              test -f pnpm-lock.yaml && test -f pnpm-workspace.yaml
              npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.25.0
              pnpm install --frozen-lockfile --ignore-scripts
              ;;
            npm@11.9.0)
              npm install --global --ignore-scripts --no-audit --no-fund npm@11.9.0
              npm ci --no-audit --no-fund
              ;;
          esac
          printf 'Candidate package manager: %s\n' "$manager"
          printf 'PND_PACKAGE_MANAGER=%s\n' "${manager%@*}" >> "$GITHUB_ENV"
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --require-hashes -r engineering/ci-python-requirements.txt

      - name: Verify and record candidate identity
        run: |
          git cat-file -e 3b899125cc8cedef938823718ad5d44f49957b66:app/erosion.ts
          node scripts/orchestration/ci-gate.mjs snapshot work/ci/before.json

      - name: Typecheck
        run: $PND_PACKAGE_MANAGER run typecheck

      - name: Parity check
        run: $PND_PACKAGE_MANAGER run parity:check

      - name: Orchestration check
        run: $PND_PACKAGE_MANAGER run orchestration:check

      - name: Production build
        run: $PND_PACKAGE_MANAGER run build

      - name: Qualify generated-only CMS encryption
        timeout-minutes: 1
        run: timeout --signal=TERM --kill-after=3s 35s python -I -B scripts/cms-interop/run.py

      - name: Reject tracked input mutation
        run: |
          git diff --exit-code HEAD --
          node scripts/orchestration/ci-gate.mjs quality work/ci/before.json work/ci/receipt.json

      - name: Upload quality receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: full-check-${{ github.run_id }}-${{ github.run_attempt }}-quality
          path: work/ci/receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload generated-only CMS interoperability fixture
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cms-interop-${{ github.run_id }}-${{ github.run_attempt }}-quality
          path: |
            ${{ runner.temp }}/pnd-cms-interop-${{ github.run_id }}-${{ github.run_attempt }}-quality/envelope.cms
            ${{ runner.temp }}/pnd-cms-interop-${{ github.run_id }}-${{ github.run_attempt }}-quality/summary.json
          if-no-files-found: error
          retention-days: 7

  test-shards:
    name: Test shard ${{ matrix.label }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { index: 0, label: 1 }
          - { index: 1, label: 2 }
          - { index: 2, label: 3 }
          - { index: 3, label: 4 }
    steps:
      - name: Require a ready pull request
        env:
          IS_DRAFT: ${{ toJSON(github.event.pull_request.draft) }}
        run: |
          if [ "$IS_DRAFT" != false ]; then
            echo '::notice::Draft PR: full checks have not run. Mark ready to start them.'
            exit 1
          fi

      - name: Check out the exact proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # erosion-observation.test.mjs reads a pinned historical Git blob.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          architecture: x64
          package-manager-cache: false

      - name: Set up Python for portable fixture tests
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
          architecture: x64

      - name: Install locked dependencies
        run: |
          manager="$(node --input-type=module -e 'import fs from "node:fs"; const manager = JSON.parse(fs.readFileSync("package.json", "utf8")).packageManager ?? "npm@11.9.0"; if (!["npm@11.9.0", "pnpm@11.25.0"].includes(manager)) throw Error("Unsupported source package-manager policy"); console.log(manager)')"
          case "$manager" in
            pnpm@11.25.0)
              test -f pnpm-lock.yaml && test -f pnpm-workspace.yaml
              npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.25.0
              pnpm install --frozen-lockfile --ignore-scripts
              ;;
            npm@11.9.0)
              npm install --global --ignore-scripts --no-audit --no-fund npm@11.9.0
              npm ci --no-audit --no-fund
              ;;
          esac
          printf 'Candidate package manager: %s\n' "$manager"
          printf 'PND_PACKAGE_MANAGER=%s\n' "${manager%@*}" >> "$GITHUB_ENV"
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --require-hashes -r engineering/ci-python-requirements.txt

      - name: Verify and record candidate identity
        run: |
          git cat-file -e 3b899125cc8cedef938823718ad5d44f49957b66:app/erosion.ts
          node scripts/orchestration/ci-gate.mjs snapshot work/ci/before.json

      - name: Run test shard
        id: shard
        run: node scripts/orchestration/test-runner.mjs shard --shard-index=${{ matrix.index }} --shard-count=4 --receipt=work/ci/shard.json --timings=summary-v1

      - name: Reject tracked input mutation
        run: |
          git diff --exit-code HEAD --
          node scripts/orchestration/ci-gate.mjs shard work/ci/before.json work/ci/receipt.json work/ci/shard.json

      - name: Upload shard receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: full-check-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.label }}
          path: work/ci/receipt.json
          if-no-files-found: error
          retention-days: 7

      # Diagnostics never enter the strict five-artifact acceptance namespace.
      - name: Upload optional per-file timing diagnostics
        if: ${{ always() && (steps.shard.outcome == 'success' || steps.shard.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-timings-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.label }}
          path: |
            work/ci/before.json
            work/ci/shard.json
            work/ci/receipt.json
            work/ci/timings/*.jsonl
          if-no-files-found: warn
          retention-days: 7

  full-check:
    # A failed, skipped or cancelled dependency must still reach this gate.
    name: ${{ toJSON(github.event.pull_request.draft) == 'false' && 'Full check' || 'Draft PR (not validated)' }}
    needs: [quality, test-shards]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Require a ready pull request
        env:
          IS_DRAFT: ${{ toJSON(github.event.pull_request.draft) }}
        run: |
          if [ "$IS_DRAFT" != false ]; then
            echo '::notice::Draft PR: full checks have not run. Mark ready to start them.'
            exit 1
          fi

      - name: Check out the exact proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # erosion-observation.test.mjs reads a pinned historical Git blob.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          architecture: x64
          package-manager-cache: false

      - name: Set up Python for portable fixture tests
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
          architecture: x64

      - name: Install locked dependencies
        run: |
          manager="$(node --input-type=module -e 'import fs from "node:fs"; const manager = JSON.parse(fs.readFileSync("package.json", "utf8")).packageManager ?? "npm@11.9.0"; if (!["npm@11.9.0", "pnpm@11.25.0"].includes(manager)) throw Error("Unsupported source package-manager policy"); console.log(manager)')"
          case "$manager" in
            pnpm@11.25.0)
              test -f pnpm-lock.yaml && test -f pnpm-workspace.yaml
              npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.25.0
              pnpm install --frozen-lockfile --ignore-scripts
              ;;
            npm@11.9.0)
              npm install --global --ignore-scripts --no-audit --no-fund npm@11.9.0
              npm ci --no-audit --no-fund
              ;;
          esac
          printf 'Candidate package manager: %s\n' "$manager"
          printf 'PND_PACKAGE_MANAGER=%s\n' "${manager%@*}" >> "$GITHUB_ENV"
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --require-hashes -r engineering/ci-python-requirements.txt

      - name: Verify and record candidate identity
        run: |
          git cat-file -e 3b899125cc8cedef938823718ad5d44f49957b66:app/erosion.ts
          node scripts/orchestration/ci-gate.mjs snapshot work/ci/before.json

      - name: Require successful dependencies
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SHARDS_RESULT: ${{ needs.test-shards.result }}
        run: test "$QUALITY_RESULT" = success && test "$SHARDS_RESULT" = success

      - name: Download current attempt receipts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: full-check-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: work/ci/receipts
          merge-multiple: false

      - name: Validate complete sharded gate
        env:
          CI_NEEDS: '{"quality":"${{ needs.quality.result }}","test-shards":"${{ needs.test-shards.result }}"}'
        run: node scripts/orchestration/ci-gate.mjs aggregate work/ci/receipts work/ci/full-check.json

      - name: Reject tracked input mutation
        run: git diff --exit-code HEAD --

  benchmark-baseline:
    # This diagnostic runs only for the reviewed activation PR, never as coverage.
    name: Legacy test baseline (diagnostic)
    needs: full-check
    if: ${{ github.event.pull_request.number == 516 && needs.full-check.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # Match the effective child environment used by the shard runner.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Require a ready pull request
        env:
          IS_DRAFT: ${{ toJSON(github.event.pull_request.draft) }}
        run: |
          if [ "$IS_DRAFT" != false ]; then
            echo '::notice::Draft PR: full checks have not run. Mark ready to start them.'
            exit 1
          fi

      - name: Check out the exact proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # erosion-observation.test.mjs reads a pinned historical Git blob.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          architecture: x64
          package-manager-cache: false

      - name: Set up Python for portable fixture tests
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
          architecture: x64

      - name: Install locked dependencies
        run: |
          manager="$(node --input-type=module -e 'import fs from "node:fs"; const manager = JSON.parse(fs.readFileSync("package.json", "utf8")).packageManager ?? "npm@11.9.0"; if (!["npm@11.9.0", "pnpm@11.25.0"].includes(manager)) throw Error("Unsupported source package-manager policy"); console.log(manager)')"
          case "$manager" in
            pnpm@11.25.0)
              test -f pnpm-lock.yaml && test -f pnpm-workspace.yaml
              npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.25.0
              pnpm install --frozen-lockfile --ignore-scripts
              ;;
            npm@11.9.0)
              npm install --global --ignore-scripts --no-audit --no-fund npm@11.9.0
              npm ci --no-audit --no-fund
              ;;
          esac
          printf 'Candidate package manager: %s\n' "$manager"
          printf 'PND_PACKAGE_MANAGER=%s\n' "${manager%@*}" >> "$GITHUB_ENV"
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --require-hashes -r engineering/ci-python-requirements.txt

      - name: Verify and record candidate identity
        run: |
          git cat-file -e 3b899125cc8cedef938823718ad5d44f49957b66:app/erosion.ts
          node scripts/orchestration/ci-gate.mjs snapshot work/ci/before.json

      - name: Legacy full test suite
        run: $PND_PACKAGE_MANAGER test

      - name: Reject tracked input mutation
        run: |
          git diff --exit-code HEAD --
          node scripts/orchestration/ci-gate.mjs baseline work/ci/before.json work/ci/baseline.json
