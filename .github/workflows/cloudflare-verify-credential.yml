name: Cloudflare credential read preflight

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: cloudflare-credential-read-preflight
  cancel-in-progress: false

jobs:
  verify-read:
    # Reject a non-main dispatch before the environment-bearing job can start.
    if: ${{ github.repository == 'JohnDeved/populous-new-dawn' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: cloudflare-worker
    permissions:
      contents: read
    env:
      NODE_OPTIONS: ''
      NODE_PATH: ''
      NODE_COMPILE_CACHE: ''
      NODE_V8_COVERAGE: ''
    steps:
      - name: Check out the exact trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/cloudflare
            scripts/artifact-zip.mjs
          sparse-checkout-cone-mode: false
      - name: Set up trusted Node without installing the project
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Verify stored credential read access only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/cloudflare/verify-access.mjs
