name: Cloudflare build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NODE_OPTIONS: ''
  NODE_PATH: ''
  NODE_COMPILE_CACHE: ''
  NODE_V8_COVERAGE: ''
  WRANGLER_SEND_METRICS: 'false'

jobs:
  build:
    # Fork code is never published to this account. No deployment secrets or
    # write token are available to this job, including for same-repository PRs.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact source commit (not the synthetic PR merge)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node without a cross-trust cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install locked pnpm dependencies
        run: |
          node --input-type=module -e 'import fs from "node:fs"; if(JSON.parse(fs.readFileSync("package.json")).packageManager !== "pnpm@11.25.0") throw Error("Unexpected package manager")'
          npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.25.0
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Build Cloudflare Worker and static assets
        run: pnpm run build:cloudflare
      - name: Upload build bytes, never an executable deployment configuration
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudflare-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/client/
            dist/server/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1
          compression-level: 1
