name: Plain Vite Home Spy guard witness

on:
  push:
    branches: [ci/spy-guard-1095-20261116]
    paths:
      - '.github/workflows/software-webgl-trial.yml'
      - 'scripts/ci-webgl-trial/shipped-selection.mjs'
      - 'scripts/ci-webgl-trial/selection-episode.mjs'

permissions:
  contents: read

concurrency:
  group: software-webgl-trial-20261110
  cancel-in-progress: false

jobs:
  screenshot:
    name: Plain Vite Home Spy guard witness
    if: ${{ github.repository == 'JohnDeved/populous-new-dawn' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PND_CANDIDATE_SHA: 895181aa7f8f05065215fb3cb813ab8640935351
      CI: 'true'
      NODE_OPTIONS: ''
      NODE_PATH: ''
      NODE_COMPILE_CACHE: ''
      NODE_V8_COVERAGE: ''
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
    steps:
      - name: Check out reviewed experiment only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trial-infrastructure
          persist-credentials: false
          sparse-checkout: scripts/ci-webgl-trial
      - name: Check out exact reviewed Spy guard candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 895181aa7f8f05065215fb3cb813ab8640935351
          path: after-source
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          architecture: x64
          package-manager-cache: false
      - name: Install locked source profile and verify reviewed host Chrome
        id: setup
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git -C after-source rev-parse HEAD)" = "$PND_CANDIDATE_SHA"
          test "$(df --output=avail -B1 . | tail -1 | tr -d ' ')" -ge 4294967296
          test "$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)" -ge 3932160
          test "$(df --output=iavail . | tail -1 | tr -d ' ')" -ge 50000
          npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.25.0
          cd after-source
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; assert.equal(JSON.parse(fs.readFileSync("package.json","utf8")).packageManager,"pnpm@11.25.0")'
          pnpm install --frozen-lockfile --ignore-scripts
          test -x /opt/google/chrome/chrome
          chrome_version="$(/opt/google/chrome/chrome --version)"
          printf '%s\n' "$chrome_version"
          case "$chrome_version" in
            'Google Chrome 157.0.8103.50'|'Google Chrome 157.0.8103.50 ') ;;
            *) printf 'Unreviewed browser version\n' >&2; exit 1 ;;
          esac
          dpkg-query --show --showformat='${Package} ${Version} ${Architecture}\n' google-chrome-stable
          sha256sum /opt/google/chrome/chrome
      - name: Snapshot dependency metadata before witness
        id: dependencies
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          mkdir -p outputs
          cat > "$RUNNER_TEMP/spy-dependency-metadata.mjs" <<'NODE'
          import { readFileSync, writeFileSync, readdirSync, statSync } from 'node:fs'
          import { resolve } from 'node:path'
          import { createHash } from 'node:crypto'
          import { runInNewContext } from 'node:vm'
          import assert from 'node:assert/strict'
          const source = readFileSync('after-source/scripts/tutorial-browser/run.mjs', 'utf8')
          const start = source.indexOf('function metadata(path, prefix =')
          const end = source.indexOf('function verifySource()', start)
          assert.ok(start >= 0 && end > start, 'Existing Tutorial metadata owner required')
          const helper = source.slice(start, end)
          const metadata = runInNewContext(helper + '\nmetadata', { readdirSync, statSync, resolve })
          const hash = value => createHash('sha256').update(JSON.stringify(value)).digest('hex')
          const current = metadata(resolve('after-source/node_modules'))
          const phase = process.argv[2]
          assert.ok(phase === 'before' || phase === 'after')
          writeFileSync(`outputs/spy-dependencies-${phase}.json`, JSON.stringify(current))
          if (phase === 'before') {
            writeFileSync('outputs/spy-dependency-integrity.json', JSON.stringify({ status: 'pending', helperSha256: createHash('sha256').update(helper).digest('hex'), beforeSha256: hash(current), scope: 'Existing Tutorial regular-file size/mtime metadata; not package-byte or symlink identity proof' }))
          } else {
            const before = JSON.parse(readFileSync('outputs/spy-dependencies-before.json', 'utf8'))
            const changes = Object.keys({ ...before, ...current }).filter(key => JSON.stringify(before[key]) !== JSON.stringify(current[key]))
            const receipt = JSON.parse(readFileSync('outputs/spy-dependency-integrity.json', 'utf8'))
            Object.assign(receipt, { status: changes.length ? 'failed' : 'passed', afterSha256: hash(current), changes })
            writeFileSync('outputs/spy-dependency-integrity.json', JSON.stringify(receipt))
            assert.equal(changes.length, 0, 'Dependency metadata changed')
          }
          NODE
          node "$RUNNER_TEMP/spy-dependency-metadata.mjs" before
      - name: Check Spy guard on exact reviewed source
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          cd after-source
          node --test tests/spy-guard-episode.test.mjs tests/spy-discovery-fixture-loading.test.mjs tests/spy-startup-settlement.test.mjs
          # Existing 120s build, 180s browser owner, 150s episode caps remain.
          # This eight-minute step bounds final owner/server teardown as well.
          env -u GITHUB_SHA SPY_DISCOVERY_MODE=guards node scripts/spy-discovery-evidence/run.mjs ../outputs/spy-guards
      - name: Verify dependency metadata even after witness failure
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: node "$RUNNER_TEMP/spy-dependency-metadata.mjs" after
      - name: Reject any tracked source or experiment mutation
        if: ${{ always() && steps.setup.outcome == 'success' }}
        run: |
          git -C after-source diff --exit-code HEAD --
          git -C trial-infrastructure diff --exit-code HEAD --
      - name: Retain Spy guard receipts and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: spy-guard-895181aa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outputs/**/*.json
            outputs/**/*.log
            outputs/**/*.html
            outputs/**/*.png
            outputs/*.v8
          if-no-files-found: warn
          retention-days: 7

