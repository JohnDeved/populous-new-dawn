name: Isolated pause candidate whole lint

on:
  push:
    branches: [ci/software-webgl-trial-20261110]
    paths:
      - '.github/workflows/software-webgl-trial.yml'
      - 'scripts/ci-webgl-trial/shipped-acceptance.mjs'
      - 'scripts/ci-webgl-trial/whole-lint.mjs'
      - 'scripts/ci-webgl-trial/compact-status-pause-trial.mjs'

permissions:
  contents: read

concurrency:
  group: software-webgl-trial-20261110
  cancel-in-progress: false

jobs:
  screenshot:
    name: Full normal lint candidate only
    if: ${{ github.repository == 'JohnDeved/populous-new-dawn' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PND_CANDIDATE_SHA: c078343e705cf31b194a6326f82b752f90c0ca23
      CI: 'true'
      NODE_OPTIONS: ''
      NODE_PATH: ''
      NODE_COMPILE_CACHE: ''
      NODE_V8_COVERAGE: ''
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
    steps:
      - name: Check out reviewed experiment only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trial-infrastructure
          persist-credentials: false
          sparse-checkout: scripts/ci-webgl-trial
      - name: Check out exact reviewed pause candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c078343e705cf31b194a6326f82b752f90c0ca23
          path: after-source
          persist-credentials: false
      - name: Check out exact main lint baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 480a1493a62c3b015ae97ebb22dfc20b6b284eae
          path: baseline-source
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          architecture: x64
          package-manager-cache: false
      - name: Install independent candidate source profile
        id: setup
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C after-source rev-parse HEAD)" = "$PND_CANDIDATE_SHA"
          test "$(git -C baseline-source rev-parse HEAD)" = '480a1493a62c3b015ae97ebb22dfc20b6b284eae'
          for path in package.json pnpm-lock.yaml pnpm-workspace.yaml eslint.config.mjs; do cmp "after-source/$path" "baseline-source/$path"; done
          test ! -e after-source/.npmrc
          test ! -e baseline-source/.npmrc
          npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.25.0
          test ! -e after-source/node_modules
          ( cd after-source && pnpm install --frozen-lockfile --ignore-scripts )
      - name: Run full normal candidate lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 6
        run: node trial-infrastructure/scripts/ci-webgl-trial/whole-lint.mjs "$PWD/after-source" "$PWD/baseline-source" "$PWD/outputs/whole-lint"
      - name: Reject any tracked source or experiment mutation
        if: ${{ always() && steps.setup.outcome == 'success' }}
        run: |
          git -C after-source diff --exit-code HEAD --
          git -C trial-infrastructure diff --exit-code HEAD --
          git -C baseline-source diff --exit-code HEAD --
      - name: Retain full lint receipts and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pause-candidate-lint-c078343-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outputs/whole-lint/*.json
            outputs/whole-lint/*.log
          if-no-files-found: warn
          retention-days: 7

