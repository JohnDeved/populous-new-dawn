name: Isolated synthetic original-host Worker stack fixture

on:
  push:
    branches: [ci/software-webgl-trial-20261110]
    paths:
      - '.github/workflows/software-webgl-trial.yml'
      - 'scripts/ci-webgl-trial/browser-stack-fixture/**'

permissions:
  contents: read

concurrency:
  group: software-webgl-trial-20261110
  cancel-in-progress: false

jobs:
  screenshot:
    name: Synthetic original-host Worker stack fixture
    if: ${{ github.repository == 'JohnDeved/populous-new-dawn' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PND_CANDIDATE_SHA: 1f76849ea332c1328553f13f4819d46f92f82ee7
      CI: 'true'
      NODE_OPTIONS: ''
      NODE_PATH: ''
      NODE_COMPILE_CACHE: ''
      NODE_V8_COVERAGE: ''
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
    steps:
      - name: Check out reviewed experiment only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trial-infrastructure
          persist-credentials: false
          sparse-checkout: scripts/ci-webgl-trial
      - name: Check out exact reviewed current-main snapshot source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1f76849ea332c1328553f13f4819d46f92f82ee7
          path: after-source
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          architecture: x64
          package-manager-cache: false
      - name: Install locked source profile and verify reviewed host Chrome
        id: setup
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git -C after-source rev-parse HEAD)" = "$PND_CANDIDATE_SHA"
          npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.25.0
          cd after-source
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; assert.equal(JSON.parse(fs.readFileSync("package.json","utf8")).packageManager,"pnpm@11.25.0")'
          pnpm install --frozen-lockfile --ignore-scripts
          test -x /opt/google/chrome/chrome
          chrome_version="$(/opt/google/chrome/chrome --version)"
          printf '%s\n' "$chrome_version"
          case "$chrome_version" in
            'Google Chrome 156.0.8078.79'|'Google Chrome 156.0.8078.79 ') ;;
            *) printf 'Unreviewed inventory browser version\n' >&2; exit 1 ;;
          esac
          dpkg-query --show --showformat='${Package} ${Version} ${Architecture}\n' google-chrome-stable
          sha256sum /opt/google/chrome/chrome
      - name: Verify synthetic WASM worker stack
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          (
            cd trial-infrastructure/scripts/ci-webgl-trial/browser-stack-fixture
            sha256sum --check --strict <<'SHA256'
          be00236ef8e1c2d6d883ad8a8884288cb0adf077b85ed93989023e5d6a822850  stack-index.html
          8bcff7a56edd01352e3970cf8ba22827a42bc64caeda2ccd6255f89852821175  browser-stack-test.mjs
          a8a84bd5095f12bdb30fa00f8d7f5cc3ccb9713109889354379ac42505591df7  browser-stack-worker.mjs
          2e89728852821110fa564a741ea4c09db48f1bb5e9010b6b768cd48d06a601f4  stack-seam.mjs
          fd6c32b45d6be914fadc07cebe010c960c784589246b977daa58caab42447d89  run-browser-stack.mjs
          SHA256
          )
          mkdir -p outputs
          timeout --kill-after=5s 90s node --max-old-space-size=256 trial-infrastructure/scripts/ci-webgl-trial/browser-stack-fixture/run-browser-stack.mjs "$PWD/after-source" "$PWD/outputs/browser-stack-fixture"
      - name: Reject any tracked source or experiment mutation
        if: ${{ always() && steps.setup.outcome == 'success' }}
        run: |
          git -C after-source diff --exit-code HEAD --
          git -C trial-infrastructure diff --exit-code HEAD --
      - name: Retain synthetic fixture stack receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: synthetic-original-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/browser-stack-fixture/
          if-no-files-found: warn
          retention-days: 7
