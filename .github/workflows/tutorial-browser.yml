name: Tutorial browser validation

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]
    paths:
      - 'app/**'
      - 'public/**'
      - 'scripts/browser-*.mjs'
      - 'scripts/local-render/tutorial-recommendation.mjs'
      - 'scripts/local-render/frontend-held-escape.mjs'
      - 'scripts/local-render/original-pause-checkpoint-recovery.mjs'
      - 'scripts/local-render/campaign-profile-recovery.mjs'
      - 'scripts/checkpoint-readback.mjs'
      - 'scripts/local-render/checkpoint-observer.mjs'
      - 'scripts/tutorial-browser/**'
      - 'scripts/browser-performance/**'
      - '.github/workflows/tutorial-browser.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/orchestration/dependency-profile.mjs'
      - 'tsconfig.json'

permissions:
  contents: read

concurrency:
  group: tutorial-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tutorial-browser:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: tutorial
            timeoutMinutes: 15
            name: Tutorial browser
            artifact: tutorial-browser
            buildStep: Build plain production Home and validate Tutorial interactions
          - scenario: frontend-held-escape
            timeoutMinutes: 15
            name: Frontend held Escape browser
            artifact: frontend-held-escape-browser
            buildStep: Build plain production Home and validate bounded frontend Escape navigation
          - scenario: compact-message-layout
            timeoutMinutes: 15
            name: Compact message layout browser
            artifact: compact-message-layout-browser
            buildStep: Validate compact messages and F8 under public HUD preferences
          - scenario: pause-checkpoint-recovery
            timeoutMinutes: 15
            name: Pause checkpoint recovery browser
            artifact: pause-checkpoint-recovery-browser
            buildStep: Build plain production Home and validate pause checkpoint recovery
          - scenario: profile-recovery
            timeoutMinutes: 15
            name: Profile recovery browser
            artifact: profile-recovery-browser
            buildStep: Build plain production Home and validate IndexedDB recovery
          - scenario: mission10-profile
            timeoutMinutes: 15
            name: Mission 10 crew persistence browser
            artifact: mission10-crew-persistence-browser
            buildStep: Build plain production Home and validate Mission 10 crew persistence
          - scenario: gameplay-frames
            timeoutMinutes: 15
            name: Gameplay frame recording browser
            artifact: gameplay-frame-recording-browser
            buildStep: Record live authored Level 2 frame exports and workload summaries
          - scenario: gameplay-resources
            timeoutMinutes: 15
            name: Gameplay resource lifecycle browser
            artifact: gameplay-resource-lifecycle-browser
            buildStep: Observe full live Mission 2 workload and one same-document resource restart
          - scenario: snapshot-protocol
            timeoutMinutes: 6
            name: Controlled snapshot functional smoke
            artifact: candidate-snapshot-functional-smoke
            buildStep: Validate candidate snapshot setup and F8 attribution, not a comparison
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      POPULOUS_BROWSER_SCENARIO: ${{ matrix.scenario }}
      CI: 'true'
      NODE_OPTIONS: ''
      NODE_PATH: ''
      NODE_COMPILE_CACHE: ''
      NODE_V8_COVERAGE: ''
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Require a ready pull request
        env:
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$IS_DRAFT" != false ]; then
            echo '::notice::Draft PR: browser validation has not run.'
            exit 1
          fi
      - name: Check out exact proposed merge
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          architecture: x64
          package-manager-cache: false
      - name: Install locked dependencies and verify supported Chrome
        run: |
          manager="$(node --input-type=module -e 'import fs from "node:fs"; const manager = JSON.parse(fs.readFileSync("package.json", "utf8")).packageManager ?? "npm@11.9.0"; if (!["npm@11.9.0", "pnpm@11.25.0"].includes(manager)) throw Error("Unsupported source package-manager policy"); console.log(manager)')"
          case "$manager" in
            pnpm@11.25.0)
              test -f pnpm-lock.yaml && test -f pnpm-workspace.yaml
              npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.25.0
              pnpm install --frozen-lockfile --ignore-scripts
              ;;
            npm@11.9.0)
              npm install --global --ignore-scripts --no-audit --no-fund npm@11.9.0
              npm ci --no-audit --no-fund
              ;;
          esac
          printf 'Candidate package manager: %s\n' "$manager"
          printf 'PND_PACKAGE_MANAGER=%s\n' "${manager%@*}" >> "$GITHUB_ENV"
          test -x /opt/google/chrome/chrome
          /opt/google/chrome/chrome --version
      - name: Record exact tested source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'PR head: %s\nBase: %s\nTested merge: %s\n' "$PR_HEAD_SHA" "$PR_BASE_SHA" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          node --version
          "$PND_PACKAGE_MANAGER" --version
          if [ "$PND_PACKAGE_MANAGER" = pnpm ]; then
            sha256sum package-lock.json pnpm-lock.yaml pnpm-workspace.yaml node_modules/.modules.yaml node_modules/.pnpm/lock.yaml node_modules/playwright-core/browsers.json
          else
            sha256sum package-lock.json node_modules/.package-lock.json node_modules/playwright-core/browsers.json
          fi
      - name: ${{ matrix.scenario == 'gameplay-resources' && 'Observe three full live Mission 2 workloads and two same-document resource restarts' || matrix.buildStep }}
        env:
          POPULOUS_GAMEPLAY_OWNERSHIP: ${{ matrix.scenario == 'gameplay-resources' && contains(github.event.pull_request.labels.*.name, format('weak-v1:{0}', github.event.pull_request.head.sha)) && 'weak-v1' || '' }}
        run: |
          if [ "$POPULOUS_BROWSER_SCENARIO" = gameplay-resources ]; then
            if [ "$POPULOUS_GAMEPLAY_OWNERSHIP" = weak-v1 ]; then
              node scripts/tutorial-browser/run.mjs outputs/tutorial-browser --gameplay-resource-profile=three-cycle-v1 --gameplay-ownership-probe=weak-v1
            else
              node scripts/tutorial-browser/run.mjs outputs/tutorial-browser --gameplay-resource-profile=three-cycle-v1
            fi
          else
            node scripts/tutorial-browser/run.mjs
          fi
      - name: Reject tracked input mutation
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: git diff --exit-code HEAD --
      - name: Retain bounded validation receipts and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: |
            outputs/tutorial-browser/*.json
            outputs/tutorial-browser/*.log
            outputs/tutorial-browser/*.png
            outputs/tutorial-browser/snapshot-*/*.json
          if-no-files-found: warn
          retention-days: 7
