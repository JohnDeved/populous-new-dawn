name: Fixed bubblewrap prerequisites (no application)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bwrap-prerequisites
  cancel-in-progress: false

jobs:
  prerequisites:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    name: Fixed build and generated namespace qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact trusted workflow infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: evidence-infrastructure
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/material-lifecycle-evidence/
            /.github/workflows/bwrap-prerequisites.yml
      - name: Check out immutable reviewed containment helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JohnDeved/populous-new-dawn
          ref: a2e1cd1b2dbda79a75a79573ff6ff504ce46845d
          path: material-helper-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/orchestration/shared_execution.py
            /scripts/orchestration/shared_runtime.py
            /scripts/orchestration/shared_setup.py
            /scripts/orchestration/shared_workspace.py
            /scripts/orchestration/state_serialization.py
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
          architecture: x64
      - name: Build private fixed prerequisite and qualify generated containment
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          timeout --signal=TERM --kill-after=5s 350s python -I -B \
            evidence-infrastructure/scripts/material-lifecycle-evidence/bwrap_prerequisites.py
      - name: Reject infrastructure and helper tracked mutation
        if: ${{ always() }}
        run: |
          git -C evidence-infrastructure diff --exit-code HEAD --
          git -C material-helper-source diff --exit-code HEAD --
      - name: Retain bounded prerequisite diagnostics only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bwrap-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/bwrap-prerequisites
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
